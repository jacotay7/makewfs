# A nine-sample quadrature load: three wavelengths crossed with three beacon
# ranges. The spectral axis exists to exercise the polychromatic path, NOT to
# model a beacon -- a sodium LGS returns the 589 nm D2 line broadened by roughly
# 0.003 nm, some three orders of magnitude narrower than the 585-595 nm sweep
# below. Spot elongation comes from the range spread and the off-axis launch,
# not from colour. For beacon physics see examples/showcase.py (monochromatic,
# sampled through the sodium layer's depth); for a genuine broadband source see
# examples/realistic_broadband.py, which uses a natural guide star.
schema_version = 1

[input]
quantity = "opd"
unit = "m"
shape = [128, 128]
grid_extent_m = 8.0

[telescope]
pupil_diameter_m = 8.0
central_obscuration_ratio = 0.14

[source]
kind = "lgs"
normalization = "detector_photon_rate"
detector_photon_rate_per_s = 5.0e5
wavelengths_m = [5.85e-7, 5.90e-7, 5.95e-7]
wavelength_weights = [0.25, 0.5, 0.25]
lgs_ranges_m = [89000.0, 90000.0, 91000.0]
lgs_range_weights = [0.25, 0.5, 0.25]
lgs_launch_position_m = [0.35, 0.0]

[sensor]
kind = "shack_hartmann"
wavelength_m = 5.90e-7

[shack_hartmann]
lenslets_across_pupil = 8
pixels_per_subaperture = 8
spot_sampling_pixels_per_lambda_over_d = 2.0
minimum_illuminated_fraction = 0.25

[detector]
preset = "generic_cmos"
exposure_s = 0.001
binning = 1
precision = "float32"

[numerics]
dtype = "float32"
fft_oversampling = 2
fft_workers = 1
