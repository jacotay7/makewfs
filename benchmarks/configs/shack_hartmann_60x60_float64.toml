schema_version = 1

[input]
quantity = "opd"
unit = "m"
shape = [480, 480]
grid_extent_m = 8.0

[telescope]
pupil_diameter_m = 8.0
central_obscuration_ratio = 0.14

[source]
kind = "ngs"
normalization = "detector_photon_rate"
detector_photon_rate_per_s = 2.0e6

[sensor]
kind = "shack_hartmann"
wavelength_m = 7.0e-7

[shack_hartmann]
lenslets_across_pupil = 60
pixels_per_subaperture = 6
spot_sampling_pixels_per_lambda_over_d = 2.0
minimum_illuminated_fraction = 0.25

[detector]
preset = "generic_cmos"
exposure_s = 0.001
binning = 1
precision = "float64"

[numerics]
dtype = "float64"
fft_oversampling = 2
fft_workers = 1
