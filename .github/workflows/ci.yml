name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint, format, and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python-version: "3.10"}
          - {os: ubuntu-latest, python-version: "3.11"}
          - {os: ubuntu-latest, python-version: "3.12"}
          - {os: ubuntu-latest, python-version: "3.13"}
          - {os: macos-latest, python-version: "3.12"}
          - {os: windows-latest, python-version: "3.12"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - run: python -m pytest -q --cov=makewfs --cov-branch --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py312
          path: coverage.xml
      - name: Validation smoke report
        run: python validation/run.py --output "${{ runner.temp }}/makewfs-validation.json"
      - name: Benchmark smoke report
        run: python benchmarks/run.py --frames 1 --output "${{ runner.temp }}/makewfs-benchmark.json"

  package:
    name: Build and install wheel
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - run: pip install --force-reinstall dist/*.whl
      - run: python -c "import makewfs; print(makewfs.__version__)"

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[docs]"
      - run: mkdocs build --strict

  interop:
    name: Optional sibling interoperability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,interop]"
      - run: python -m pytest -q -m interop

  examples:
    name: Worked-example smoke tests
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[examples,interop]"
      - name: Run headless examples
        env:
          MPLBACKEND: Agg
        run: |
          mkdir -p "$RUNNER_TEMP/makewfs-examples"
          python examples/quickstart.py --output "$RUNNER_TEMP/makewfs-examples/quickstart.png"
          python examples/compare_sensors.py --output "$RUNNER_TEMP/makewfs-examples/compare.png"
          python examples/lgs_elongation.py --output "$RUNNER_TEMP/makewfs-examples/lgs.png"
          python examples/moving_atmosphere.py --steps 6 --output "$RUNNER_TEMP/makewfs-examples/moving.png"
      - uses: actions/upload-artifact@v4
        with:
          name: worked-example-smoke
          path: ${{ runner.temp }}/makewfs-examples
