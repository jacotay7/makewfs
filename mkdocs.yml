site_name: makewfs
site_description: Configuration-driven adaptive-optics wavefront sensor images
repo_url: https://github.com/jacotay7/makewfs
theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: false
            members_order: source
            show_root_heading: true
            separate_signature: true
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.arithmatex:
      generic: true
nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Concepts: concepts.md
  - Configuration: configuration.md
  - Units and coordinates: units-and-coordinates.md
  - Guide stars: guide-stars.md
  - Shack-Hartmann: shack-hartmann.md
  - Pyramid: pyramid.md
  - Detectors and radiometry: detectors.md
  - Interoperability: interop.md
  - Validation: validation.md
  - Examples: examples.md
  - Performance: performance.md
  - Troubleshooting: troubleshooting.md
  - Stability: stability.md
  - API reference: api.md
  - Contributing: contributing.md
  - Architecture decisions:
      - Index: adr/index.md
      - Units and coordinates: adr/0001-units-coordinates.md
      - Flux normalization: adr/0002-flux-normalization.md
      - Public API: adr/0003-public-api.md
      - Backend boundary: adr/0004-backend-boundary.md
