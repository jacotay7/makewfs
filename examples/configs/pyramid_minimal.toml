schema_version = 1

[input]
quantity = "opd"
unit = "m"
shape = [128, 128]
grid_extent_m = 8.0

[telescope]
pupil_diameter_m = 8.0
central_obscuration_ratio = 0.14

[source]
kind = "ngs"
normalization = "detector_photon_rate"
# ~2e6 detected photons per 1 ms frame: a bright NGS (R ~ 5 on an 8 m
# aperture with ~35% throughput), so example frames sit well above read noise.
detector_photon_rate_per_s = 2.0e9

[sensor]
kind = "pyramid"
wavelength_m = 7.0e-7

[pyramid]
pixels_across_pupil = 64
# Centre-to-centre pupil spacing; larger than pixels_across_pupil so the four
# pupil images stay separated with a 16-pixel gap between their edges.
pupil_separation_pixels = 80
modulation_radius_lambda_over_d = 0.0
modulation_samples = 1

[detector]
preset = "generic_cmos"
exposure_s = 0.001
temperature_c = 20.0
binning = 1
binning_mode = "digital"
precision = "float32"

[numerics]
dtype = "float32"
fft_oversampling = 2
fft_workers = 1
