schema_version = 1

[input]
quantity = "opd"
unit = "m"
shape = [128, 128]
grid_extent_m = 8.0

[telescope]
pupil_diameter_m = 8.0
central_obscuration_ratio = 0.14

[source]
kind = "lgs"
normalization = "detector_photon_rate"
# User-supplied sodium-LGS return at the detector surface; makewfs never
# predicts laser return flux.
detector_photon_rate_per_s = 2.0e8
# Fast mode: the 0.5 arcsec source extent and the sodium profile below become
# one fixed convolution per subaperture instead of 9 x 9 = 81 propagations.
lgs_model = "kernel"
angular_fwhm_arcsec = 0.5
# Gaussian sodium layer, 10 km FWHM about 90 km, sampled at -2..2 sigma.
lgs_ranges_m = [81507.0, 83630.0, 85753.0, 87877.0, 90000.0, 92123.0, 94247.0, 96370.0, 98493.0]
lgs_range_weights = [0.1353, 0.3247, 0.6065, 0.8825, 1.0, 0.8825, 0.6065, 0.3247, 0.1353]
# Side launch: elongation grows with the launch-to-subaperture baseline.
lgs_launch_position_m = [4.5, 0.0]

[sensor]
kind = "shack_hartmann"
wavelength_m = 589.0e-9

[shack_hartmann]
lenslets_across_pupil = 8
pixels_per_subaperture = 16
spot_sampling_pixels_per_lambda_over_d = 1.0
minimum_illuminated_fraction = 0.5

[detector]
preset = "generic_cmos"
exposure_s = 0.001
temperature_c = 20.0
binning = 1
binning_mode = "digital"
precision = "float32"

[numerics]
dtype = "float32"
fft_oversampling = 2
fft_workers = 1
# The lenslet field repeats every 48 lambda/d (48 pixels here), which keeps the
# elongated spots inside one alias-free period for both LGS models.
pupil_samples_per_lenslet = 48
