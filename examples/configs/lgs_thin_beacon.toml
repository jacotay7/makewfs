schema_version = 1

[input]
quantity = "opd"
unit = "m"
shape = [128, 128]
grid_extent_m = 8.0

[telescope]
pupil_diameter_m = 8.0
central_obscuration_ratio = 0.14

[source]
kind = "lgs"
normalization = "detector_photon_rate"
# User-supplied sodium-LGS return at the detector surface (makewfs never
# predicts laser return flux); ~2e5 photons per 1 ms frame keeps the spots
# visible over generic_cmos read noise.
detector_photon_rate_per_s = 2.0e8

[sensor]
kind = "shack_hartmann"
wavelength_m = 589.0e-9

[shack_hartmann]
lenslets_across_pupil = 8
pixels_per_subaperture = 8
spot_sampling_pixels_per_lambda_over_d = 2.0
minimum_illuminated_fraction = 0.25

[detector]
preset = "generic_cmos"
exposure_s = 0.001
temperature_c = 20.0
binning = 1
binning_mode = "digital"
precision = "float32"

[numerics]
dtype = "float32"
fft_oversampling = 2
fft_workers = 1
