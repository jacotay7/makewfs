schema_version = 1

[input]
quantity = "opd"
unit = "m"
shape = [128, 128]
grid_extent_m = 8.0

[telescope]
pupil_diameter_m = 8.0
central_obscuration_ratio = 0.14

[source]
kind = "ngs"
normalization = "detector_photon_rate"
detector_photon_rate_per_s = 2.0e9

[sensor]
kind = "shack_hartmann"
wavelength_m = 7.0e-7

[shack_hartmann]
lenslets_across_pupil = 8
pixels_per_subaperture = 8
spot_sampling_pixels_per_lambda_over_d = 2.0
minimum_illuminated_fraction = 0.5
# Four pre-declared half-pitch dither positions of the lenslet grid relative to
# the pupil, selected per frame with offset_state = 0..3. Each is added to the
# static lenslet_grid_offset_fraction (default [0, 0]).
lenslet_grid_offset_states_fraction = [[0.0, 0.0], [0.5, 0.0], [0.0, 0.5], [0.5, 0.5]]

[detector]
preset = "generic_cmos"
exposure_s = 0.001
temperature_c = 20.0
binning = 1
binning_mode = "digital"
precision = "float32"

[numerics]
dtype = "float32"
fft_oversampling = 2
fft_workers = 1
# Area-weighted pupil edges, so the translated illumination is smooth.
pupil_supersampling = 4
