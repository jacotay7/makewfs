[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "makewfs"
dynamic = ["version"]
description = "Configuration-driven adaptive-optics wavefront sensor image simulation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jacob Taylor", email = "jacobataylor7@gmail.com" }]
keywords = ["adaptive-optics", "wavefront-sensor", "shack-hartmann", "pyramid"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.10",
    "getframes>=2.1.1",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "build>=1.0",
    "mypy>=1.8",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.6",
]
docs = ["mkdocs>=1.5", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.24"]
examples = ["matplotlib>=3.7"]
interop = ["pyturb>=1.0"]
validation = ["hcipy>=0.6"]
gpu = ["cupy-cuda12x>=13.0"]

[project.scripts]
makewfs = "makewfs.cli:main"

[project.urls]
Homepage = "https://github.com/jacotay7/makewfs"
Documentation = "https://jacotay7.github.io/makewfs/"
Repository = "https://github.com/jacotay7/makewfs"
Issues = "https://github.com/jacotay7/makewfs/issues"
Changelog = "https://github.com/jacotay7/makewfs/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/makewfs"]

[tool.hatch.version]
path = "src/makewfs/__about__.py"

[tool.hatch.build.targets.sdist]
include = [
    "src/makewfs",
    "tests",
    "docs",
    "examples",
    "validation",
    "benchmarks",
    "README.md",
    "ROADMAP.md",
    "AGENTS.md",
    "CONTRIBUTING.md",
    "CITATION.cff",
    "LICENSE",
    "CHANGELOG.md",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = ["B905"]

[tool.ruff.lint.isort]
known-first-party = ["makewfs"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
files = ["src/makewfs"]

[[tool.mypy.overrides]]
module = ["cupy.*", "cupyx.*", "getframes.*", "scipy.*", "matplotlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "gpu: optional CuPy/CUDA backend parity tests",
    "slow: slower statistical or gallery tests",
    "validation: theory/reference validation tests",
    "interop: tests requiring optional pyturb/getframes sibling APIs",
]

[tool.coverage.run]
source = ["makewfs"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
